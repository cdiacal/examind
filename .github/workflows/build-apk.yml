name: Compilar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ya trae el SDK de Android; solo hay que aceptar las licencias
      # para que Gradle pueda descargar las plataformas que le falten.
      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pruebas unitarias
        run: gradle :nucleo:test testDebugUnitTest

      - name: Compilar APK (debug)
        run: gradle assembleDebug

      - name: Subir el APK para poder descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: Examind-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Esquema de la base de datos generado por Room, para guardarlo en el repositorio
      - name: Subir el esquema de la base de datos
        uses: actions/upload-artifact@v4
        with:
          name: esquema-bd
          path: app/schemas
          if-no-files-found: ignore
